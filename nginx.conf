server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Requests not explicitly allowlisted below are never proxied to an
    # internal service. Per-route limits provide a second layer behind the
    # application-level validation.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Chat responses are Server-Sent Events. Buffering must stay disabled so
    # the browser receives tokens and tool events as the agent emits them.
    location = /api/agent/chat {
        client_max_body_size 1m;
        proxy_pass http://agent:8100/chat;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Discard browser-supplied forwarding headers. The agent trusts only
        # this proxy-authored connection address for its server-side hash.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Accel-Buffering "no" always;
    }

    location = /api/agent/health {
        proxy_pass http://agent:8100/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/agent/ready {
        proxy_pass http://agent:8100/ready;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/asr/transcribe {
        client_max_body_size 2m;
        proxy_pass http://asr:8005/transcribe;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/asr/health {
        proxy_pass http://asr:8005/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/tts/tts {
        client_max_body_size 2m;
        proxy_pass http://tts:9991/tts;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/tts/health {
        proxy_pass http://tts:9991/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Do not expose service documentation, OpenAPI schemas, metrics, or any
    # future backend route merely because it shares an /api prefix.
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Not Found"}\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
